name: Build GraalVM Native Image MSI

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build:
    name: Build GraalVM Native Image MSI
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: archivetune-updates
      R2_ENDPOINT: https://b6d8d21b428522e1a0ab90b4f3c0bdea.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://pub-90881360725b42cab24caebe4e55fa2d.r2.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSYS2 UCRT64 native toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-binutils

      - name: Cache Rust stem worker
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stem-worker -> target

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
          gradle-home-cache-includes: |
            caches
            notifications
            nucleus

      - name: Verify Java runtime
        shell: pwsh
        run: java -version

      - name: Install AWS CLI
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: python -m pip install awscli

      - name: Verify R2 credentials
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          aws s3api list-objects-v2 `
            --bucket $env:R2_BUCKET `
            --max-keys 1 `
            --endpoint-url $env:R2_ENDPOINT `
            --region auto | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "R2 credential preflight failed (aws exit code $LASTEXITCODE)."
          }

      - name: Build GraalVM Native Image MSI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio C++ build tools were not found on the Windows runner.'
          }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 && call gradlew.bat msiNative --stacktrace"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-native\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($msi.FullName)"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: Publish desktop update to R2
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $versionLine = Select-String -Path 'desktopApp/build.gradle.kts' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not determine desktop version from desktopApp/build.gradle.kts.'
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          .\scripts\publish-r2-update.ps1 `
            -MsiPath '${{ steps.msi.outputs.path }}' `
            -ExecutablePath 'desktopApp\build\compose\binaries\main-native\app\ArchiveTune\ArchiveTune.exe' `
            -Version $version `
            -Bucket $env:R2_BUCKET `
            -Endpoint $env:R2_ENDPOINT `
            -PublicBaseUrl $env:R2_PUBLIC_URL
