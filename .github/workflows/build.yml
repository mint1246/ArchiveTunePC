name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows MSI
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up IBM Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'semeru'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Verify Java runtime
        shell: pwsh
        run: java -version

      - name: Build upgradable Windows MSI
        shell: pwsh
        run: |
          $env:ARCHIVETUNE_OPENJ9_HOME = $env:JAVA_HOME
          .\gradlew.bat :msiJ9 --stacktrace

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-release\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($msi.FullName)"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
