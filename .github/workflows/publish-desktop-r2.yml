name: Publish desktop update

on:
  workflow_dispatch:
    inputs:
      version:
        description: ArchiveTune desktop version
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: archivetune-updates
      R2_ENDPOINT: https://b6d8d21b428522e1a0ab90b4f3c0bdea.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://pub-90881360725b42cab24caebe4e55fa2d.r2.dev

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install AWS CLI
        shell: pwsh
        run: python -m pip install awscli

      - name: Build native MSI
        shell: pwsh
        run: .\gradlew.bat msiNative --no-daemon

      - name: Publish MSI and manifest to R2
        shell: pwsh
        run: |
          $expected = "desktopApp/build/compose/binaries/main-native/msi/ArchiveTune-${{ inputs.version }}.msi"
          if (-not (Test-Path -LiteralPath $expected)) {
            throw "Expected MSI not found at $expected. Make sure desktopApp/build.gradle.kts version matches the workflow input."
          }
          .\scripts\publish-r2-update.ps1 `
            -MsiPath $expected `
            -Version "${{ inputs.version }}" `
            -Bucket $env:R2_BUCKET `
            -Endpoint $env:R2_ENDPOINT `
            -PublicBaseUrl $env:R2_PUBLIC_URL