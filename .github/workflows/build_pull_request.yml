name: Build Pull Request Windows MSI

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up IBM Semeru OpenJ9 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'semeru'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Verify Java runtime
        shell: pwsh
        run: java -version

      - name: Build upgradable Windows MSI
        shell: pwsh
        run: |
          $env:ARCHIVETUNE_OPENJ9_HOME = $env:JAVA_HOME
          .\gradlew.bat :msiJ9 --stacktrace

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-release\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($msi.FullName)"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI-PR-${{ github.event.number }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
