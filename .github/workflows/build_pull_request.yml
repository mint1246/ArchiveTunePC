name: Build Pull Request (Desktop & Android)

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Release APK (Unsigned PR Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Assemble Android GMS Mobile Arm64 Release APK (Unsigned)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :app:assembleGmsMobileArm64Release --stacktrace -x :spotlessApply

      - name: Upload Unsigned Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Android-APK-PR-${{ github.event.number }}
          path: app/build/outputs/apk/gmsMobileArm64/release/*.apk
          if-no-files-found: error

  build-desktop:
    name: Build GraalVM Native Image MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSYS2 UCRT64 native toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-binutils

      - name: Add MSYS2 tools to PATH
        shell: pwsh
        run: |
          Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin' >> $env:GITHUB_PATH

      - name: Cache Rust stem worker
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stem-worker -> target

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            nucleus

      - name: Verify Java runtime
        shell: pwsh
        run: java -version

      - name: Build GraalVM Native Image MSI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio C++ build tools were not found on the Windows runner.'
          }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 && call gradlew.bat msiNative --stacktrace -PnativeQuickBuild=true"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-native\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($msi.FullName)"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI-PR-${{ github.event.number }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
