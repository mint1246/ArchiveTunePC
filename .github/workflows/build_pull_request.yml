name: Build Pull Request GraalVM Native Image MSI

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build GraalVM Native Image MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            nucleus

      - name: Verify Java runtime
        shell: pwsh
        run: java -version

      - name: Build GraalVM Native Image MSI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio C++ build tools were not found on the Windows runner.'
          }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 && call gradlew.bat msiNative --stacktrace"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-native\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($msi.FullName)"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI-PR-${{ github.event.number }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
