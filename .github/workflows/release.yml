name: Release GraalVM Native Image MSI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'desktopApp/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check desktop version
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NEW_VERSION="$(grep -oP '^version\s*=\s*"\K[^"]+' desktopApp/build.gradle.kts | head -n 1)"
          if [ -z "$NEW_VERSION" ]; then
            echo 'Could not read desktop version from desktopApp/build.gradle.kts' >&2
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "v$NEW_VERSION already exists; skipping release."
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Preparing v$NEW_VERSION."
          fi

  build:
    name: Build release GraalVM Native Image MSI
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSYS2 UCRT64 native toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-binutils

      - name: Cache Rust stem worker
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stem-worker -> target

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            nucleus

      - name: Build GraalVM Native Image MSI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw 'Visual Studio C++ build tools were not found on the Windows runner.'
          }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 && call gradlew.bat msiNative --stacktrace"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'desktopApp\build\compose\binaries\main-native\msi' -Filter '*.msi' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw 'Windows MSI was not produced.'
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveTune-Windows-MSI-${{ needs.check-version.outputs.new_version }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.new_version }}
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: |
          gh release create "v$env:VERSION" `
            --target "${{ github.sha }}" `
            --title "ArchiveTune $env:VERSION" `
            --generate-notes `
            "$env:MSI_PATH"
